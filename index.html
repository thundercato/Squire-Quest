<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Squire Quest I: The Dragon Slayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" crossorigin="anonymous" />
  <script>
    const folder = 'game/'
    const qeditor = false
    const resourcesFolder = 'https://cdn.jsdelivr.net/gh/ThePix/QuestJS@72fef6a7315b2d977d8b4f57c358a11ba85d765a/'
    const squireQuestDevCacheToken = Date.now().toString(36) + Math.random().toString(36).slice(2)

    function squireQuestFreshUrl(url) {
      if (!url) return url
      const separator = url.includes('?') ? '&' : '?'
      return url + separator + 'sqdev=' + encodeURIComponent(squireQuestDevCacheToken)
    }
  </script>
  <script src="https://cdn.jsdelivr.net/gh/ThePix/QuestJS@72fef6a7315b2d977d8b4f57c358a11ba85d765a/lib/_util.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/ThePix/QuestJS@72fef6a7315b2d977d8b4f57c358a11ba85d765a/lib/_settings.js"></script>
  <script>
    const gameSettings = document.createElement('script')
    gameSettings.src = squireQuestFreshUrl(folder + 'settings.js')
    gameSettings.onload = function () {
      const originalLoadScript = settings.loadScript.bind(settings)
      const originalLoadCssFile = settings.loadCssFile.bind(settings)

      settings.loadScript = function (filename, doc) {
        return originalLoadScript(squireQuestFreshUrl(filename), doc)
      }

      settings.loadCssFile = function (filename, doc, path) {
        return originalLoadCssFile(squireQuestFreshUrl(filename), doc, path)
      }

      settings.writeScript(folder, '', '')
    }
    gameSettings.onerror = function () { console.error('Failed to load game/settings.js') }
    document.head.appendChild(gameSettings)
  </script>
</head>
<body>
  <div id="opening-screen" class="full-screen-card" aria-label="Squire Quest opening title">
    <div class="manuscript-card title-card">
      <div class="title-kicker">GAC Software Inc. presents</div>
      <h1>Squire Quest I</h1>
      <div class="game-subtitle">The Dragon Slayer</div>
      <div class="chapter-rule" aria-hidden="true">◆</div>
      <div class="chapter-number">Chapter 1</div>
      <div class="chapter-title">Gimme Gimme Gimme Fried Chicken!</div>
      <div class="continue-hint">Tap or press Enter to begin</div>
    </div>
  </div>

  <div id="travel-screen" class="full-screen-card" hidden aria-live="assertive">
    <div class="manuscript-card travel-card">
      <div class="travel-ornament" aria-hidden="true">❧</div>
      <p id="travel-text"></p>
      <div class="continue-hint">Tap or press Enter to continue</div>
    </div>
  </div>

  <h1 id="loading">Squire Quest is loading...</h1>
  <main id="main">
    <div id="inner">
      <section id="scene-panel" aria-live="polite">
        <h2 id="room-title" class="room-title">Eastern Dock</h2>
        <div id="room-art">
          <img id="room-image" alt="" hidden />
        </div>
      </section>
      <section id="story-panel" aria-label="Game text and command input">
        <div id="output"></div>
        <div id="input"></div>
      </section>
    </div>
  </main>
  <dialog id="dialog">
    <form method="dialog">
      <h4 id="dialog-title"></h4>
      <hr />
      <div id="dialog-content"></div>
      <div id="dialog-footer" style="text-align:right">
        <hr />
        <button id="dialog-button" value="default">Confirm</button>
      </div>
    </form>
  </dialog>
  <div id="quest-map"></div>
  <div id="quest-image"></div>
  <form style="display:none" id="fileDialogForm">
    <input type="file" id="fileDialog" accept=".q6save" />
  </form>
</body>
</html>
