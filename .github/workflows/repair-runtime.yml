name: Repair QuestJS runtime references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair stale dungeon room identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for p in Path('game').glob('puzzle-*.js'):
              s = p.read_text()
              s = s.replace("'dungeon_cell_west'", "'dungeon_cell_2'")
              s = s.replace("'vent_shaft_start'", "'inside_vent_shaft'")
              s = s.replace("'dungeon_cell'", "'dungeon_cell_1'")
              s = s.replace('w.dungeon_cell.', 'w.dungeon_cell_1.')
              s = s.replace('w.dungeon_cell_1.up =', 'w.dungeon_cell_1.north =')
              p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          for file in game/*.js; do node --check "$file"; done
      - name: Remove one-shot workflow
        run: rm .github/workflows/repair-runtime.yml
      - name: Commit repair
        run: |
          git config user.name 'Squire Quest Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add game/puzzle-*.js .github/workflows/repair-runtime.yml
          git commit -m 'Fix stale dungeon room references causing movement crash'
          git push
