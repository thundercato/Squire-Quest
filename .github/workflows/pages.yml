name: Deploy Squire Quest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game JavaScript
        run: |
          for file in game/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run browser movement smoke test
        run: |
          python3 -m http.server 8765 >/tmp/squire-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo '<body data-smoke-status="fail"><pre>No Chrome/Chromium binary available</pre></body>' > /tmp/squire-smoke.html
            echo 'No Chrome/Chromium binary available' > /tmp/squire-chrome.log
            exit 0
          fi

          "$CHROME" --headless=new --no-sandbox --disable-gpu --enable-logging=stderr --v=0 \
            --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8765/tests/browser-smoke.html \
            > /tmp/squire-smoke.html 2> /tmp/squire-chrome.log || true
          cp /tmp/squire-http.log /tmp/squire-http.log.saved || true
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            /tmp/squire-smoke.html
            /tmp/squire-http.log.saved
            /tmp/squire-chrome.log
      - name: Verify browser movement smoke test
        run: |
          cat /tmp/squire-smoke.html
          echo '--- Chrome console ---'
          cat /tmp/squire-chrome.log
          grep -q 'data-smoke-status="pass"' /tmp/squire-smoke.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
